<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Happy Birthday Lorena</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id=c></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;
const W=()=>cv.width,H=()=>cv.height,N=1200;
const pts=[...Array(N)].map(()=>({x:Math.random()*W(),y:Math.random()*H(),tx:0,ty:0}));
const off=document.createElement('canvas'),ox=off.getContext('2d');
off.width=W();off.height=H();
function targets(mode){
 ox.clearRect(0,0,off.width,off.height);
 ox.fillStyle="#fff"; ox.textAlign="center";
 if(mode==0){
   ox.font="bold "+Math.min(W(),H())*.35+"px Arial";
   ox.fillText("❤",W()/2,H()/2+H()*.12);
 }else{
   ox.font="bold "+Math.min(W(),H())*.09+"px Arial";
   ox.fillText("HAPPY",W()/2,H()/2-60);
   ox.fillText("BIRTHDAY",W()/2,H()/2+20);
   ox.fillStyle="#fff";ox.font="bold "+Math.min(W(),H())*.11+"px Arial";
   ox.fillText("LORENA ❤",W()/2,H()/2+120);
 }
 const d=ox.getImageData(0,0,W(),H()).data,arr=[];
 for(let y=0;y<H();y+=5)for(let x0=0;x0<W();x0+=5){
   if(d[(y*W()+x0)*4+3]>100)arr.push([x0,y]);
 }
 for(let i=0;i<N;i++){
   let p=arr[i%arr.length];pts[i].tx=p[0];pts[i].ty=p[1];
 }
}
targets(0);
let t0=performance.now();
function draw(ts){
 let t=(ts-t0)/1000;
 if(t<3){
   for(let p of pts){p.y+=6;if(p.y>H())p.y=0;
     x.beginPath();x.fillStyle="#66ccff";x.shadowBlur=12;x.shadowColor="#66ccff";
     x.arc(p.x,p.y,2,0,7);x.fill();}
 }else{
   if(t>7)targets(1);
   for(let p of pts){
    p.x+=(p.tx-p.x)*0.06;p.y+=(p.ty-p.y)*0.06;
    x.beginPath();x.fillStyle=t<7?"#ff3355":"#ffee88";
    x.shadowBlur=10;x.shadowColor=x.fillStyle;
    x.arc(p.x,p.y,2,0,7);x.fill();
   }
 }
 x.fillStyle="rgba(0,0,0,.15)";x.fillRect(0,0,W(),H());
 requestAnimationFrame(draw);
}
function loop(ts){x.clearRect(0,0,W(),H());draw(ts)}
requestAnimationFrame(loop);
</script></body></html>
